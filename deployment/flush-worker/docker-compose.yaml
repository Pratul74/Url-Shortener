services:

  flush_worker:

    image: pratul74/url-shortener-backend:latest

    restart: unless-stopped

    command:
      - python
      - -m
      - backend.analytics.flush_worker

    env_file:
      - .env

    networks:
      - url_shortener_network

networks:
  url_shortener_network:
    name: url_shortener_network
