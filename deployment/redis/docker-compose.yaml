services:

  redis:

    image: redis:7

    restart: always

    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf

    ports:
      - "6379:6379"

    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
      - redis_data:/data
    networks:
      - url_shortener_network

networks:
  url_shortener_network:
    name: url_shortener_network

volumes:
  redis_data:
